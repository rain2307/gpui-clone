[patch.crates-io.webrtc-sys]
git = "https://github.com/zed-industries/livekit-rust-sdks"
rev = "c3a55bbc207008f1ca3474b6037fdd3c443cad0f"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.dbg.build-override]
debug = "full"

[profile.release.package]

[workspace.lints.rust.unexpected_cfgs]
level = "allow"

[workspace.lints.clippy.style]
level = "allow"
priority = -1

[profile.dev.package.gpui_macros]
opt-level = 3

[profile.dev.package.derive_refineable]
opt-level = 3

[profile.dev.package.util_macros]
opt-level = 3

[profile.dev.package.collections]
codegen-units = 1

[profile.dev.package.refineable]
codegen-units = 1

[profile.dev.package.reqwest_client]
codegen-units = 1
